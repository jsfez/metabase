name: Argos

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Argos authenticates with a short-lived OIDC token minted by GitHub, so no
# project token needs to be stored as a repository secret.
permissions:
  contents: read
  id-token: write

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Build Storybook
        run: bun run build-storybook

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Argos visual tests
        run: bunx playwright test --config argos/playwright.config.ts
